# DRAFT, UNTESTED. Bumps the digest-pinned base images. Each bump is a PR that
# must rebuild, pass the smoke test and publish a new digest; consumers then
# take that digest by their own PR. Note: the estate's KYAML rule allows .yml
# here because Dependabot demands the name.
version: 2
updates:
  - package-ecosystem: docker
    directory: /agda
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /lean
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
